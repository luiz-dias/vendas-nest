name: actions-workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v1
        with:
          node-version: 22.x

      - run: npm install   # boa prática: usar "npm ci" se houver package-lock.json
      - run: npm test
      - run: npm run build
      - run: npm run deploy
